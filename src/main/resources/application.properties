spring.application.name=soulup-api

# Porta: o Render/Railway informam a porta pela variável PORT
server.port=${PORT:8080}

# Banco Oracle - valores sempre vindos de variáveis de ambiente
app.db.url=${DB_URL}
app.db.user=${DB_USER}
app.db.password=${DB_PASSWORD}

# URL do front publicado na Vercel (liberada no CorsFilter)
app.front-url=${FRONT_URL:}

# Datas no JSON em ISO-8601 (ex.: 2026-10-25T21:30:00)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo
